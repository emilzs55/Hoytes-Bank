<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse | Hoyte's Bank</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!--Fontawesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!--Estilos-->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="d-flex justify-content-between align-items-center">
        <div style="width:40px"></div>
        <h1 class="text-center">
            <a href="index.html" class="d-flex align-items-center justify-content-center gap-2">
                <span class="three-crowns" title="Hoyte's Bank Private Banking">♛♛♛</span>
                <span>Hoyte's Bank</span>
            </a>
        </h1>
        <button id="btn-lang" class="btn btn-sm btn-outline-warning" onclick="setIdioma(getIdioma() === 'es' ? 'en' : 'es')">
            <i class="fa-solid fa-globe"></i> <span id="lang-label">EN</span>
        </button>
    </header>
    <main>
        <section class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-5">
                    <div id="mensaje"></div>
                    <div class="card p-4">
                        <div class="text-center mb-3">
                            <span style="font-size: 1.8rem; color: var(--gold-primary); letter-spacing: 8px;">♛♛♛</span>
                        </div>
                        <h2 class="text-center mb-4" data-lang="tituloRegistro" style="font-size: 2rem; color: var(--gold-light);">Registro de usuario</h2>
                    <form id="form-registro">
                        <div class="mb-3">
                            <label for="nombre" class="form-label" data-lang="labelNombre">Nombre completo</label>
                            <input type="text" name="nombre" class="form-control" id="nombre" placeholder="Ingrese su nombre" data-lang-placeholder="placeholderNombre" required>
                        </div>
                        <div class="mb-3">
                            <label for="usuario" class="form-label" data-lang="labelUsuario">Usuario</label>
                            <input type="text" name="usuario" class="form-control" id="usuario" placeholder="Ingrese su usuario" data-lang-placeholder="placeholderUsuario" required>
                        </div>
                        <div class="mb-3">
                            <label for="correo" class="form-label" data-lang="labelCorreo">Correo electrónico</label>
                            <input type="email" name="correo" class="form-control" id="correo" placeholder="ejemplo@correo.com" data-lang-placeholder="placeholderCorreo" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label" data-lang="labelPassword">Contraseña</label>
                            <div class="input-group">
                                <input type="password" name="password" class="form-control" id="password" placeholder="Mín. 8 caracteres, 1 mayúscula, 1 símbolo y 2 números" data-lang-placeholder="placeholderPasswordReg" required minlength="8">
                                <button class="btn btn-outline-secondary btn-toggle-pass" type="button" data-target="password">
                                    <i class="fa-solid fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="confirmar_password" class="form-label" data-lang="labelConfirmar">Confirmar contraseña</label>
                            <div class="input-group">
                                <input type="password" name="confirmar_password" class="form-control" id="confirmar_password" placeholder="Reingrese su contraseña" data-lang-placeholder="placeholderConfirmar" required>
                                <button class="btn btn-outline-secondary btn-toggle-pass" type="button" data-target="confirmar_password">
                                    <i class="fa-solid fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="mt-5">
                            <button type="submit" class="btn btn-success w-100" data-lang="btnRegistrarse">Registrarse</button>
                        </div>
                    </form>
                    <div>
                        <p class="text-center pt-3 mb-0"><span data-lang="yaTienesCuenta" class="text-white-50">¿Ya tienes cuenta?</span> <a href="login.html" data-lang="linkIniciarSesion" class="fw-bold">Iniciar sesión</a></p>
                    </div>
                    </div> <!-- fin card -->
                </div>
            </div>
        </section>
    </main>
    <footer>
        <p class="text-center" data-lang="footer">© 2026 Hoyte's Bank</p>
    </footer>
    
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Ciberseguridad: Si ya hay una sesión activa, redirigir al menú privado
        try {
            const sesionActiva = JSON.parse(localStorage.getItem("usuarioLogueado"));
            if(sesionActiva && sesionActiva.usuario){
                window.location.href = "menu.html";
            }
        } catch(e) {}

        document.getElementById("form-registro").addEventListener("submit", function(event){
            event.preventDefault();

            //limpiar y validar textos (seguridad básica)
            const nombre = document.getElementById("nombre").value.trim();
            const usuario = document.getElementById("usuario").value.trim().toLowerCase();
            const password = document.getElementById("password").value;
            const confirmarPassword = document.getElementById("confirmar_password").value;

            if(password !== confirmarPassword){
                document.getElementById("mensaje").innerHTML = `
                <div class="alert alert-danger alert-dismissible fade show">
                    ${t("passNoCoincide")}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                `;
                return;
            }

            // validar password seguro
            const tieneMayuscula = /[A-Z]/.test(password);
            const tieneSimbolo = /[^a-zA-Z0-9]/.test(password);
            const cantidadNumeros = (password.match(/\d/g) || []).length;

            if(password.length < 8 || !tieneMayuscula || !tieneSimbolo || cantidadNumeros < 2){
                document.getElementById("mensaje").innerHTML = `
                <div class="alert alert-danger alert-dismissible fade show">
                    ${t("passInsegura")}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                `;
                return;
            }

            let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

            //verificar duplicados
            const existe = usuarios.some(function(u){ return u.usuario === usuario; });
            if(existe){
                document.getElementById("mensaje").innerHTML = `
                <div class="alert alert-warning alert-dismissible fade show">
                    ${t("usuarioExiste")}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                `;
                return;
            }

            // limpiar texto
            const nombreLimpio = nombre.replace(/</g, "").replace(/>/g, "");

            const nuevoUsuario = {
                nombre: nombreLimpio, 
                usuario: usuario, 
                correo: document.getElementById("correo").value.trim().toLowerCase(),
                password: password
            };

            usuarios.push(nuevoUsuario);
            localStorage.setItem("usuarios", JSON.stringify(usuarios));

            //Asignar saldo inicial de 400.000 si no existe o si es inválido
            let saldoActual = Number(localStorage.getItem("saldo"));
            if(isNaN(saldoActual) || saldoActual < 0 || !localStorage.getItem("saldo")){
                localStorage.setItem("saldo", "400000");
            }

            document.getElementById("mensaje").innerHTML = `
            <div class="alert alert-success alert-dismissible fade show">
                ${t("registroExito")}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            `;

            setTimeout(() =>{
                window.location.href = "login.html";
            }, 2500);

        })

        // toggle para mostrar/ocultar contraseña
        document.querySelectorAll(".btn-toggle-pass").forEach(function(btn){
            btn.addEventListener("click", function(){
                var input = document.getElementById(btn.getAttribute("data-target"));
                var icono = btn.querySelector("i");
                if(input.type === "password"){
                    input.type = "text";
                    icono.classList.remove("fa-eye");
                    icono.classList.add("fa-eye-slash");
                } else {
                    input.type = "password";
                    icono.classList.remove("fa-eye-slash");
                    icono.classList.add("fa-eye");
                }
            });
        });
    </script>

    <script src="assets/js/lang.js"></script>
    <script>
        document.querySelectorAll("[data-lang]").forEach(function(el){
            el.textContent = t(el.getAttribute("data-lang"));
        });
        document.querySelectorAll("[data-lang-placeholder]").forEach(function(el){
            el.placeholder = t(el.getAttribute("data-lang-placeholder"));
        });
        document.getElementById("lang-label").textContent = getIdioma() === "es" ? "EN" : "ES";
    </script>
</body>
</html>
