<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse | Alke Wallet</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!--Estilos-->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header>
        <h1 class="text-center">Alke Wallet</h1>
    </header>
    <main>
        <section class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div id="mensaje"></div>
                    <h2 class="text-center mb-4">Registro de usuario</h2>
                    <form id="form-registro">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre completo</label>
                            <input type="text" name="nombre" class="form-control" id="nombre" placeholder="Ingrese su nombre" required>
                        </div>
                        <div class="mb-3">
                            <label for="usuario" class="form-label">Usuario</label>
                            <input type="text" name="usuario" class="form-control" id="usuario" placeholder="Ingrese su usuario" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" name="password" class="form-control" id="password" placeholder="Mín. 8 caracteres, 1 mayúscula, 1 símbolo y 2 números" required minlength="8">
                        </div>
                        <div class="mb-3">
                            <label for="confirmar_password" class="form-label">Confirmar contraseña</label>
                            <input type="password" name="confirmar_password" class="form-control" id="confirmar_password" placeholder="Reingrese su contraseña" required>
                        </div>
                        <div class="mt-5">
                            <button type="submit" class="btn btn-primary w-100">Registrarse</button>
                        </div>
                    </form>
                    <div>
                        <p class="text-center pt-3">¿Ya tienes cuenta? <a href="login.html" >Iniciar sesión</a></p>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <p class="text-center">© 2026 Alke Wallet</p>
    </footer>
    
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.getElementById("form-registro").addEventListener("submit", function(event){
            event.preventDefault();

            //limpiar y validar textos (seguridad básica)
            const nombre = document.getElementById("nombre").value.trim();
            const usuario = document.getElementById("usuario").value.trim().toLowerCase();
            const password = document.getElementById("password").value;
            const confirmarPassword = document.getElementById("confirmar_password").value;

            if(password !== confirmarPassword){
                document.getElementById("mensaje").innerHTML = `
                <div class="alert alert-danger alert-dismissible fade show">
                    Las contraseñas no coinciden.
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                `;
                return;
            }

            // validar password seguro
            const tieneMayuscula = /[A-Z]/.test(password);
            const tieneSimbolo = /[^a-zA-Z0-9]/.test(password);
            const cantidadNumeros = (password.match(/\d/g) || []).length;

            if(password.length < 8 || !tieneMayuscula || !tieneSimbolo || cantidadNumeros < 2){
                document.getElementById("mensaje").innerHTML = `
                <div class="alert alert-danger alert-dismissible fade show">
                    La contraseña debe tener al menos 8 caracteres, 1 letra mayúscula, 1 símbolo y al menos 2 números.
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                `;
                return;
            }

            let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

            //verificar duplicados
            const existe = usuarios.some(function(u){ return u.usuario === usuario; });
            if(existe){
                document.getElementById("mensaje").innerHTML = `
                <div class="alert alert-warning alert-dismissible fade show">
                    El usuario ya está registrado en el sistema.
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                `;
                return;
            }

            // limpiar texto
            const nombreLimpio = nombre.replace(/</g, "").replace(/>/g, "");

            const nuevoUsuario = {
                nombre: nombreLimpio, 
                usuario: usuario, 
                password: password
            };

            usuarios.push(nuevoUsuario);
            localStorage.setItem("usuarios", JSON.stringify(usuarios));

            //Asignar saldo inicial de 400.000 si no existe o si es inválido
            let saldoActual = Number(localStorage.getItem("saldo"));
            if(isNaN(saldoActual) || saldoActual < 0 || !localStorage.getItem("saldo")){
                localStorage.setItem("saldo", "400000");
            }

            document.getElementById("mensaje").innerHTML = `
            <div class="alert alert-success alert-dismissible fade show">
                Registro exitoso. Redirigiendo....
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            `;

            setTimeout(() =>{
                window.location.href = "login.html";
            }, 2500);

        })
    </script>
</body>
</html>
