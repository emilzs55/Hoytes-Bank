<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depositar | Hoyte's Bank</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!--Fontawesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!--Estilos-->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="d-flex justify-content-between align-items-center">
        <div class="d-flex gap-2">
            <a href="menu.html" class="btn btn-sm btn-outline-warning"><i class="fa-solid fa-reply"></i></a>
        </div>
        <h1 class="text-center">
            <a href="menu.html" class="d-flex align-items-center justify-content-center gap-2">
                <span class="three-crowns" title="Hoyte's Bank Private Banking">♛♛♛</span>
                <span>Hoyte's Bank</span>
            </a>
        </h1>
        <div class="d-flex gap-2 align-items-center">
            <button id="btn-lang" class="btn btn-sm btn-outline-warning" onclick="setIdioma(getIdioma() === 'es' ? 'en' : 'es')">
                <i class="fa-solid fa-globe"></i> <span id="lang-label">EN</span>
            </button>
            <button id="logout" class="btn btn-sm btn-danger">
                <i class="fa-solid fa-power-off"></i>
            </button>
        </div>
    </header>
    <main id="menu">
        <section class="container mb-4">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="tarjeta-virtual text-start">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="d-flex align-items-center gap-3">
                                <i class="fa-solid fa-microchip chip-tarjeta mb-0"></i>
                                <span class="badge bg-light text-dark fw-bold">HOYTE'S BANK</span>
                            </div>
                            <span style="font-size: 1.5rem; color: var(--gold-primary); letter-spacing: 6px;">♛♛♛</span>
                        </div>
                        <p class="text-white-50 mb-0 small text-uppercase" data-lang="saldoEnCuenta">Saldo en cuenta</p>
                        <span class="saldo mb-0">£0</span>
                    </div>
                </div>
            </div>
        </section>

        <section class="container">
            <div class="row justify-content-center">
                <div class="col-10 col-md-8 col-lg-6">
                    <div id="mensaje"></div>
                    <div class="card">
                        <div class="card-body">
                            <h3 class="text-center mb-3" data-lang="tituloDeposito">Ingresar dinero</h3>
                            <form id="form-deposito">
                                <div class="mb-3">
                                    <label for="monto" class="form-label" data-lang="labelMonto">Monto a depositar</label>
                                    <input type="text" class="form-control" id="monto" placeholder="Ej: 15000 o 15.000" data-lang-placeholder="placeholderMonto" required>
                                </div>
                                <div class="mt-4">
                                    <button type="submit" class="btn btn-success w-100" data-lang="btnDeposito">Confirmar depósito</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <p class="text-center" data-lang="footer">© 2026 Hoyte's Bank</p>
    </footer>
    
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // validar sesion
        let sesionValida = false;
        try {
            const usuario = JSON.parse(localStorage.getItem("usuarioLogueado"));
            if(usuario && usuario.usuario){
                sesionValida = true;
            }
        } catch(e) {}

        if(!sesionValida){
            window.location.href = "login.html";
        }

        // boton salir
        document.getElementById("logout").addEventListener("click", function(){
            localStorage.removeItem("usuarioLogueado");
            window.location.href = "login.html";
        })

        // mostrar saldo
        let saldo = Number(localStorage.getItem("saldo"));
        if(isNaN(saldo) || saldo < 0) saldo = 0;
        document.querySelector(".saldo").textContent = "£" + saldo.toLocaleString("en-GB");

        // evento depositar
        $("#form-deposito").on("submit", function(event){
            event.preventDefault();

            // limpiar puntos de miles si el usuario ingresa ej: 100.000
            let montoLimpio = $("#monto").val().replace(/\./g, "").replace(/,/g, "").trim();
            const monto = Number(montoLimpio);

            // validar monto
            if(monto <= 0 || isNaN(monto)){
                document.getElementById("mensaje").innerHTML = `
                <div class="alert alert-danger alert-dismissible fade show">
                    ${t("montoInvalido")}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                `;
                return;
            }

            if(monto > 200000){
                document.getElementById("mensaje").innerHTML = `
                <div class="alert alert-warning alert-dismissible fade show">
                    ${t("topeDeposito")}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                `;
                return;
            }

            saldo = Math.round(saldo + monto);
            localStorage.setItem("saldo", saldo);

            let transacciones = JSON.parse(localStorage.getItem("transacciones")) || [];
            transacciones.push({
                tipo: "Deposito",
                monto: monto,
                fecha: new Date().toLocaleDateString("es-CL"),
                destinatario: "Cuenta propia"
            });
            localStorage.setItem("transacciones", JSON.stringify(transacciones));

            $(".saldo").fadeOut(200, function(){
                $(this).text("£" + saldo.toLocaleString("en-GB")).fadeIn(200);
            });

            document.getElementById("mensaje").innerHTML = `
            <div class="alert alert-success alert-dismissible fade show">
                ${t("depositoExito")}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            `;

            setTimeout(() =>{
                window.location.href = "menu.html";
            }, 2000)
        });
    </script>
    <script src="assets/js/lang.js"></script>
    <script>
        document.querySelectorAll("[data-lang]").forEach(function(el){
            el.textContent = t(el.getAttribute("data-lang"));
        });
        document.querySelectorAll("[data-lang-placeholder]").forEach(function(el){
            el.placeholder = t(el.getAttribute("data-lang-placeholder"));
        });
        document.getElementById("lang-label").textContent = getIdioma() === "es" ? "EN" : "ES";
    </script>
</body>
</html>
