<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú | Alke Wallet</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!--Fontawesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!--Estilos-->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="d-flex justify-content-between align-items-center">
        <a href="menu.html" class="btn btn-success"><i class="fa-solid fa-reply"></i></a>
        <h1 class="text-center">Alke Wallet</h1>
        <button id="logout" class="btn btn-danger">
            <i class="fa-solid fa-power-off"></i>
        </button>
    </header>
    <main id="menu">
        <section class="container mb-5">
            <div class="row justify-content-center">
                <div class="col-10 col-md-9">
                    <div class="card">
                        <div class="card-body text-center">
                            <h2>Saldo disponible</h2>
                            <span class="saldo">$0</span>
                            <p>Tu saldo total actual</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="container">
            <div class="row row-gap-3 justify-content-center">
                <div class="col-10 col-md-3">
                    <div class="card">
                        <div class="card-body text-center">
                            <h3>Depositar</h3>
                            <p>Agrega dinero a tu billetera virtual.</p>
                            <a href="deposit.html" class="btn btn-success">Depositar</a>
                        </div>
                    </div>
                </div>
                <div class="col-10 col-md-3">
                    <div class="card">
                        <div class="card-body text-center">
                            <h3>Enviar dinero</h3>
                            <p>Realiza transferencias a otros usuarios.</p>
                            <a href="sendmoney.html" class="btn btn-success">Enviar</a>
                        </div>
                    </div>
                </div>
                <div class="col-10 col-md-3">
                    <div class="card">
                        <div class="card-body text-center">
                            <h3>Transacciones</h3>
                            <p>Consulta el historial de movimientos.</p>
                            <a href="transaction.html" class="btn btn-success">Ver historial</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <p class="text-center">© 2026 Alke Wallet</p>
    </footer>
    
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        //Proteger página contra manipulación de sesión
        let sesionValida = false;
        try {
            const usuario = JSON.parse(localStorage.getItem("usuarioLogueado"));
            if(usuario && usuario.usuario){
                sesionValida = true;
            }
        } catch(err) {
            sesionValida = false;
        }

        if(!sesionValida){
            localStorage.removeItem("usuarioLogueado");
            window.location.href = "login.html";
        }

        //CERRAR SESIÓN
        document.getElementById("logout").addEventListener("click", function(){
            localStorage.removeItem("usuarioLogueado");
            window.location.href = "login.html";
        })

        //SALDO verificado
        let saldo = Number(localStorage.getItem("saldo"));
        if(isNaN(saldo) || saldo < 0){
            saldo = 0;
            localStorage.setItem("saldo", "0");
        }
        document.querySelector(".saldo").textContent = "$" + saldo.toLocaleString("es-CL");

        $(document).ready(function(){
            $(".card").hide().fadeIn(600);
        });
    </script>
</body>
</html>
