<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Hoyte's Bank</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!--Fontawesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!--Estilos-->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="d-flex justify-content-between align-items-center">
        <div style="width:40px"></div>
        <h1 class="text-center">
            <a href="index.html" class="d-flex align-items-center justify-content-center gap-2">
                <span class="three-crowns" title="Hoyte's Bank Private Banking">♛♛♛</span>
                <span>Hoyte's Bank</span>
            </a>
        </h1>
        <button id="btn-lang" class="btn btn-sm btn-outline-warning" onclick="setIdioma(getIdioma() === 'es' ? 'en' : 'es')">
            <i class="fa-solid fa-globe"></i> <span id="lang-label">EN</span>
        </button>
    </header>
    <main>
        <section class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-5">
                    <div id="mensaje"></div>
                    <div class="card p-4">
                        <div class="text-center mb-3">
                            <span style="font-size: 1.8rem; color: var(--gold-primary); letter-spacing: 8px;">♛♛♛</span>
                        </div>
                        <h2 class="text-center mb-4" data-lang="tituloLogin" style="font-size: 2rem; color: var(--gold-light);">Iniciar sesión</h2>
                    <form id="form-login">
                        <div class="mb-3">
                            <label for="usuario" class="form-label" data-lang="labelUsuario">Usuario</label>
                            <input type="text" name="usuario" class="form-control" id="usuario" placeholder="Ingrese su usuario" data-lang-placeholder="placeholderUsuario" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label" data-lang="labelPassword">Contraseña</label>
                            <div class="input-group">
                                <input type="password" name="password" class="form-control" id="password" placeholder="Ingrese su contraseña" data-lang-placeholder="placeholderPassword" required>
                                <button class="btn btn-outline-secondary btn-toggle-pass" type="button" data-target="password">
                                    <i class="fa-solid fa-eye"></i>
                                </button>
                            </div>
                            <div class="text-end mt-2">
                                <a href="#" class="small text-white-50" data-bs-toggle="modal" data-bs-target="#modalOlvide" data-lang="olvidePass">¿Olvidaste tu contraseña?</a>
                            </div>
                        </div>
                        <div class="mt-4">
                            <button type="submit" class="btn btn-success w-100" data-lang="btnLogin">Iniciar sesión</button>
                        </div>
                    </form>
                    <div>
                        <p class="text-center pt-3 mb-0"><span data-lang="noTienesCuenta" class="text-white-50">¿No tienes cuenta?</span> <a href="register.html" data-lang="linkRegistrarse" class="fw-bold">Registrarse</a></p>
                    </div>
                    </div> <!-- fin card -->
                </div>
            </div>
        </section>
    </main>

    <!-- Modal Recuperar Contraseña -->
    <div class="modal fade" id="modalOlvide" tabindex="-1" aria-labelledby="modalOlvideLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark border border-secondary text-light p-3" style="border-radius: 16px;">
                <div class="modal-header border-bottom border-secondary border-opacity-25">
                    <h5 class="modal-title brand-font" id="modalOlvideLabel" style="color: var(--gold-light);"><i class="fa-solid fa-key me-2 text-warning"></i> <span data-lang="recuperarTitulo">Recuperar Contraseña</span></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body py-3">
                    <div id="mensaje-recuperar"></div>
                    <p class="small text-white-50 mb-3" data-lang="recuperarDesc">Ingresa tu nombre de usuario para restablecer tu contraseña en el sistema.</p>
                    <form id="form-recuperar">
                        <div class="mb-3">
                            <label for="recuperar-user" class="form-label" data-lang="labelUsuario">Usuario</label>
                            <input type="text" class="form-control" id="recuperar-user" placeholder="Tu usuario" required>
                        </div>
                        <div class="mb-3" id="div-nueva-pass" style="display: none;">
                            <label for="nueva-pass" class="form-label" data-lang="labelNuevaPass">Nueva Contraseña</label>
                            <input type="password" class="form-control" id="nueva-pass" placeholder="Mín. 8 caracteres, 1 mayúscula, 1 símbolo y 2 números">
                        </div>
                        <button type="submit" id="btn-recuperar-submit" class="btn btn-success w-100 mt-2" data-lang="btnBuscarUser">Buscar Cuenta</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p class="text-center" data-lang="footer">© 2026 Hoyte's Bank</p>
    </footer>
    
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Ciberseguridad: Si ya hay una sesión activa, redirigir al menú privado
        try {
            const sesionActiva = JSON.parse(localStorage.getItem("usuarioLogueado"));
            if(sesionActiva && sesionActiva.usuario){
                window.location.href = "menu.html";
            }
        } catch(e) {}

        document.getElementById("form-login").addEventListener("submit", function(event){
            event.preventDefault();

            const usuario = document.getElementById("usuario").value.trim().toLowerCase();
            const password = document.getElementById("password").value;

            let usuarios = [];
            try {
                usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];
            } catch(e) {
                usuarios = [];
            }

            const usuarioEncontrado = usuarios.find(function (user){
                return user.usuario === usuario && user.password === password;
            })

            if(usuarioEncontrado){
                localStorage.setItem("usuarioLogueado", JSON.stringify(usuarioEncontrado));

                document.getElementById("mensaje").innerHTML = `
                <div class="alert alert-success alert-dismissible fade show">
                    ${t("loginExito")}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                `;
                setTimeout(() =>{
                    window.location.href = "menu.html";
                }, 2000)
            }else{
                document.getElementById("mensaje").innerHTML = `
                <div class="alert alert-danger alert-dismissible fade show">
                    ${t("loginError")}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                `;
                setTimeout(() =>{
                    document.getElementById("mensaje").innerHTML ="";
                }, 3000)
            }
        });

        // toggle para mostrar/ocultar contraseña
        document.querySelectorAll(".btn-toggle-pass").forEach(function(btn){
            btn.addEventListener("click", function(){
                var input = document.getElementById(btn.getAttribute("data-target"));
                var icono = btn.querySelector("i");
                if(input.type === "password"){
                    input.type = "text";
                    icono.classList.remove("fa-eye");
                    icono.classList.add("fa-eye-slash");
                } else {
                    input.type = "password";
                    icono.classList.remove("fa-eye-slash");
                    icono.classList.add("fa-eye");
                }
            });
        });

        // lógica recuperar contraseña
        let usuarioARecuperar = null;
        document.getElementById("form-recuperar").addEventListener("submit", function(e){
            e.preventDefault();
            let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];
            
            if(!usuarioARecuperar){
                const inputUser = document.getElementById("recuperar-user").value.trim().toLowerCase();
                const encontrado = usuarios.find(u => u.usuario === inputUser);
                if(encontrado){
                    usuarioARecuperar = encontrado;
                    document.getElementById("recuperar-user").disabled = true;
                    document.getElementById("div-nueva-pass").style.display = "block";
                    document.getElementById("nueva-pass").required = true;
                    document.getElementById("btn-recuperar-submit").textContent = t("btnRestablecer");
                    document.getElementById("mensaje-recuperar").innerHTML = `
                        <div class="alert alert-info py-2 small">Cuenta encontrada: ${encontrado.nombre || encontrado.usuario}. Ingresa tu nueva contraseña.</div>
                    `;
                } else {
                    document.getElementById("mensaje-recuperar").innerHTML = `
                        <div class="alert alert-danger py-2 small">${t("userNoEncontrado")}</div>
                    `;
                }
            } else {
                const nuevaPass = document.getElementById("nueva-pass").value;
                const tieneMayuscula = /[A-Z]/.test(nuevaPass);
                const tieneSimbolo = /[^a-zA-Z0-9]/.test(nuevaPass);
                const cantidadNumeros = (nuevaPass.match(/\d/g) || []).length;

                if(nuevaPass.length < 8 || !tieneMayuscula || !tieneSimbolo || cantidadNumeros < 2){
                    document.getElementById("mensaje-recuperar").innerHTML = `
                    <div class="alert alert-danger py-2 small">
                        La contraseña debe tener al menos 8 caracteres, 1 letra mayúscula, 1 símbolo y 2 números.
                    </div>
                    `;
                    return;
                }

                // actualizar en localStorage
                usuarios = usuarios.map(u => {
                    if(u.usuario === usuarioARecuperar.usuario){
                        u.password = nuevaPass;
                    }
                    return u;
                });
                localStorage.setItem("usuarios", JSON.stringify(usuarios));
                document.getElementById("mensaje-recuperar").innerHTML = `
                    <div class="alert alert-success py-2 small">${t("passRestablecida")}</div>
                `;
                setTimeout(() => {
                    var modal = bootstrap.Modal.getInstance(document.getElementById('modalOlvide'));
                    if(modal) modal.hide();
                    location.reload();
                }, 1800);
            }
        });
    </script>

    <script src="assets/js/lang.js"></script>
    <script>
        document.querySelectorAll("[data-lang]").forEach(function(el){
            el.textContent = t(el.getAttribute("data-lang"));
        });
        document.querySelectorAll("[data-lang-placeholder]").forEach(function(el){
            el.placeholder = t(el.getAttribute("data-lang-placeholder"));
        });
        document.getElementById("lang-label").textContent = getIdioma() === "es" ? "EN" : "ES";
    </script>
</body>
</html>
