<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Hoyte's Bank</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!--Fontawesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!--Estilos-->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="d-flex justify-content-between align-items-center">
        <div style="width:40px"></div>
        <h1 class="text-center"><a href="index.html">Hoyte's Bank</a></h1>
        <button id="btn-lang" class="btn btn-sm btn-outline-warning" onclick="setIdioma(getIdioma() === 'es' ? 'en' : 'es')">
            <i class="fa-solid fa-globe"></i> <span id="lang-label">EN</span>
        </button>
    </header>
    <main>
        <section class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div id="mensaje"></div>
                    <h2 class="text-center mb-4" data-lang="tituloLogin">Iniciar sesión</h2>
                    <form id="form-login">
                        <div class="mb-3">
                            <label for="usuario" class="form-label" data-lang="labelUsuario">Usuario</label>
                            <input type="text" name="usuario" class="form-control" id="usuario" placeholder="Ingrese su usuario" data-lang-placeholder="placeholderUsuario" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label" data-lang="labelPassword">Contraseña</label>
                            <div class="input-group">
                                <input type="password" name="password" class="form-control" id="password" placeholder="Ingrese su contraseña" data-lang-placeholder="placeholderPassword" required>
                                <button class="btn btn-outline-secondary btn-toggle-pass" type="button" data-target="password">
                                    <i class="fa-solid fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="mt-5">
                            <button type="submit" class="btn btn-success w-100" data-lang="btnLogin">Iniciar sesión</button>
                        </div>
                    </form>
                    <div>
                        <p class="text-center pt-3"><span data-lang="noTienesCuenta">¿No tienes cuenta?</span> <a href="register.html" data-lang="linkRegistrarse">Registrarse</a></p>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <p class="text-center" data-lang="footer">© 2026 Hoyte's Bank</p>
    </footer>
    
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.getElementById("form-login").addEventListener("submit", function(event){
            event.preventDefault();

            const usuario = document.getElementById("usuario").value.trim().toLowerCase();
            const password = document.getElementById("password").value;

            let usuarios = [];
            try {
                usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];
            } catch(e) {
                usuarios = [];
            }

            const usuarioEncontrado = usuarios.find(function (user){
                return user.usuario === usuario && user.password === password;
            })

            if(usuarioEncontrado){
                localStorage.setItem("usuarioLogueado", JSON.stringify(usuarioEncontrado));

                document.getElementById("mensaje").innerHTML = `
                <div class="alert alert-success alert-dismissible fade show">
                    Inicio de sesión exitoso.
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                `;
                setTimeout(() =>{
                    window.location.href = "menu.html";
                }, 2000)
            }else{
                document.getElementById("mensaje").innerHTML = `
                <div class="alert alert-danger alert-dismissible fade show">
                    Usuario y/o contraseña incorrectos.
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                `;
                setTimeout(() =>{
                    document.getElementById("mensaje").innerHTML ="";
                }, 3000)
            }
        });

        // toggle para mostrar/ocultar contraseña
        document.querySelectorAll(".btn-toggle-pass").forEach(function(btn){
            btn.addEventListener("click", function(){
                var input = document.getElementById(btn.getAttribute("data-target"));
                var icono = btn.querySelector("i");
                if(input.type === "password"){
                    input.type = "text";
                    icono.classList.remove("fa-eye");
                    icono.classList.add("fa-eye-slash");
                } else {
                    input.type = "password";
                    icono.classList.remove("fa-eye-slash");
                    icono.classList.add("fa-eye");
                }
            });
        });
    </script>

    <script src="assets/js/lang.js"></script>
    <script>
        document.querySelectorAll("[data-lang]").forEach(function(el){
            el.textContent = t(el.getAttribute("data-lang"));
        });
        document.querySelectorAll("[data-lang-placeholder]").forEach(function(el){
            el.placeholder = t(el.getAttribute("data-lang-placeholder"));
        });
        document.getElementById("lang-label").textContent = getIdioma() === "es" ? "EN" : "ES";
    </script>
</body>
</html>
