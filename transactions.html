<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transacciones | Alke Wallet</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!--Fontawesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!--Estilos-->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="d-flex justify-content-between align-items-center">
        <a href="menu.html" class="btn btn-success"><i class="fa-solid fa-reply"></i></a>
        <h1 class="text-center">Alke Wallet</h1>
        <button id="logout" class="btn btn-danger">
            <i class="fa-solid fa-power-off"></i>
        </button>
    </header>
    <main class="py-5">
        <section class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-10">
                    <h2 class="text-center mb-4">Historial de movimientos</h2>
                    
                    <div class="card">
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-hover mt-2">
                                    <thead>
                                        <tr>
                                            <th>Fecha</th>
                                            <th>Tipo</th>
                                            <th>Monto</th>
                                            <th>Detalle</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tabla-movimientos">
                                    </tbody>
                                </table>
                            </div>
                            <div id="vacio" class="text-center py-4" style="display: none;">
                                <p>No tienes transacciones registradas aún.</p>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </section>
    </main>
    <footer>
        <p class="text-center">© 2026 Alke Wallet</p>
    </footer>
    
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        //verificar sesión segura
        let sesionValida = false;
        try {
            const u = JSON.parse(localStorage.getItem("usuarioLogueado"));
            if(u && u.usuario) sesionValida = true;
        } catch(e) {}

        if(!sesionValida){
            window.location.href = "login.html";
        }

        // boton salir
        document.getElementById("logout").addEventListener("click", function(){
            localStorage.removeItem("usuarioLogueado");
            window.location.href = "login.html";
        })

        // cargar movimientos
        const historial = JSON.parse(localStorage.getItem("transacciones")) || [];

        if(historial.length === 0){
            $(".table").hide();
            $("#vacio").show();
        }else{
            $.each(historial, function(i, mov){
                let color = mov.tipo === "Deposito" ? "text-success" : "text-danger";
                let signo = mov.tipo === "Deposito" ? "+" : "-";
                
                let fila = $("<tr>");
                fila.append($("<td>").text(mov.fecha || ""));
                fila.append($("<td>").text(mov.tipo || ""));
                fila.append($("<td>").addClass(color + " fw-bold").text(`${signo}$${Number(mov.monto || 0).toLocaleString("es-CL")}`));
                fila.append($("<td>").text(mov.destinatario || ""));

                $("#tabla-movimientos").append(fila);
            });
            
            $(".table").hide().fadeIn(500);
        }
    </script>
</body>
</html>
