<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar dinero | Alke Wallet</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!--Fontawesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!--Estilos-->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="d-flex justify-content-between align-items-center">
        <a href="menu.html" class="btn btn-success"><i class="fa-solid fa-reply"></i></a>
        <h1 class="text-center"><a href="menu.html">Alke Wallet</a></h1>
        <button id="logout" class="btn btn-danger">
            <i class="fa-solid fa-power-off"></i>
        </button>
    </header>
    <main id="menu">
        <section class="container mb-3">
            <div class="row justify-content-center">
                <div class="col-10 col-md-8 col-lg-6">
                    <div class="tarjeta-virtual text-start mb-2">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <i class="fa-solid fa-microchip chip-tarjeta mb-0"></i>
                            <span class="badge bg-light text-dark fw-bold">ALKE VIRTUAL</span>
                        </div>
                        <p class="text-white-50 mb-0 small text-uppercase">Saldo disponible</p>
                        <span class="saldo mb-0">$0</span>
                    </div>
                </div>
            </div>
        </section>

        <section class="container">
            <div class="row justify-content-center">
                <div class="col-10 col-md-8 col-lg-6">
                    <div id="mensaje"></div>

                    <!-- agenda de contactos -->
                    <div class="card mb-3">
                        <div class="card-body">
                            <h4>Contactos</h4>
                            <div id="lista-badges" class="mb-3"></div>
                            <div class="input-group">
                                <input type="text" id="nuevo-contacto" class="form-control" placeholder="Nuevo contacto...">
                                <button class="btn btn-primary" id="btn-agregar">Agregar</button>
                            </div>
                        </div>
                    </div>

                    <!-- formulario envio -->
                    <div class="card">
                        <div class="card-body">
                            <h3 class="mb-3">Transferir fondos</h3>
                            <form id="form-envio">
                                <div class="mb-3">
                                    <label class="form-label">Destinatario</label>
                                    <input type="text" id="destinatario" class="form-control" placeholder="Selecciona o escribe un nombre" list="mis-contactos" required>
                                    <datalist id="mis-contactos"></datalist>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Monto</label>
                                    <input type="text" id="monto" class="form-control" placeholder="Ej: 5000 o 5.000" required>
                                </div>
                                <div class="mt-4">
                                    <button type="submit" class="btn btn-success w-100">Enviar dinero</button>
                                </div>
                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </section>
    </main>
    <footer>
        <p class="text-center">© 2026 Alke Wallet</p>
    </footer>
    
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        //validar sesión
        let sesionValida = false;
        try {
            const u = JSON.parse(localStorage.getItem("usuarioLogueado"));
            if(u && u.usuario) sesionValida = true;
        } catch(e) {}

        if(!sesionValida){
            window.location.href = "login.html";
        }

        //CERRAR SESIÓN
        document.getElementById("logout").addEventListener("click", function(){
            localStorage.removeItem("usuarioLogueado");
            window.location.href = "login.html";
        })

        //SALDO
        let saldo = Number(localStorage.getItem("saldo"));
        if(isNaN(saldo) || saldo < 0) saldo = 0;
        document.querySelector(".saldo").textContent = "$" + saldo.toLocaleString("es-CL");

        //evitar XSS sanitizando textos
        function sanitizar(texto){
            return texto.replace(/</g, "").replace(/>/g, "").trim();
        }

        //CONTACTOS
        function mostrarContactos(){
            let contactos = JSON.parse(localStorage.getItem("contactos")) || ["Juan Pérez", "María Gómez"];
            
            $("#mis-contactos").empty();
            $("#lista-badges").empty();

            $.each(contactos, function(index, nombre){
                let nombreSeguro = sanitizar(nombre);
                $("#mis-contactos").append(`<option value="${nombreSeguro}">`);
                
                let badge = $("<span>").addClass("badge bg-secondary p-2 me-1").text(nombreSeguro);
                $("#lista-badges").append(badge);
            });
        }

        mostrarContactos();

        //AGREGAR CONTACTO
        $("#btn-agregar").click(function(){
            const nuevo = sanitizar($("#nuevo-contacto").val());
            if(nuevo !== ""){
                let contactos = JSON.parse(localStorage.getItem("contactos")) || ["Juan Pérez", "María Gómez"];
                if(!contactos.includes(nuevo)){
                    contactos.push(nuevo);
                    localStorage.setItem("contactos", JSON.stringify(contactos));
                    mostrarContactos();
                    $("#lista-badges span:last").hide().slideDown(300);
                }
                $("#nuevo-contacto").val("");
            }
        });

        //ENVIAR DINERO
        document.getElementById("form-envio").addEventListener("submit", function(event){
            event.preventDefault();

            const destinatario = sanitizar(document.getElementById("destinatario").value);
            // limpiar puntos de miles si ingresan ej: 100.000
            let montoLimpio = document.getElementById("monto").value.replace(/\./g, "").replace(/,/g, "").trim();
            const monto = Number(montoLimpio);

            if(destinatario === ""){
                return;
            }

            // filtro firewall
            let firewallActivo = localStorage.getItem("firewallCripto");
            if(firewallActivo === null) firewallActivo = "true";

            let sitiosRiesgo = ["bitcoin", "cripto", "crypto", "binance", "casino", "apuesta", "buda", "moonpay"];
            let destMin = destinatario.toLowerCase();

            let esRiesgoso = sitiosRiesgo.some(function(palabra){ return destMin.includes(palabra); });

            if(firewallActivo === "true" && esRiesgoso){
                document.getElementById("mensaje").innerHTML = `
                <div class="alert alert-danger alert-dismissible fade show border border-2 border-danger">
                    <strong><i class="fa-solid fa-shield-halved"></i> BLOQUEO FIREWALL:</strong> Transferencia detenida automáticamente por seguridad. Tienes activada la protección contra operaciones en sitios de Criptomonedas y Casinos. Puedes apagar este escudo desde el Menú principal.
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                `;
                return;
            }

            // validar monto
            if(monto <= 0 || isNaN(monto)){
                document.getElementById("mensaje").innerHTML = `
                <div class="alert alert-danger alert-dismissible fade show">
                    Monto inválido.
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                `;
                return;
            }

            if(monto > 200000){
                document.getElementById("mensaje").innerHTML = `
                <div class="alert alert-warning alert-dismissible fade show">
                    Por seguridad, el tope máximo por transferencia es de $200.000.
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                `;
                return;
            }

            if(monto > saldo){
                document.getElementById("mensaje").innerHTML = `
                <div class="alert alert-danger alert-dismissible fade show">
                    Fondos insuficientes para esta transferencia.
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                `;
                return;
            }

            saldo = Math.round(saldo - monto);
            localStorage.setItem("saldo", saldo);

            let transacciones = JSON.parse(localStorage.getItem("transacciones")) || [];
            transacciones.push({
                tipo: "Envio",
                monto: monto,
                fecha: new Date().toLocaleDateString("es-CL"),
                destinatario: destinatario
            });
            localStorage.setItem("transacciones", JSON.stringify(transacciones));

            document.querySelector(".saldo").textContent = "$" + saldo.toLocaleString("es-CL");

            //usar text para evitar XSS en alerta
            let alerta = $(`
            <div class="alert alert-success alert-dismissible fade show">
                <span id="texto-exito"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            `);
            alerta.find("#texto-exito").text(`Transferencia de $${monto.toLocaleString("es-CL")} enviada con éxito a ${destinatario}. Redirigiendo...`);
            $("#mensaje").html(alerta);

            setTimeout(() =>{
                window.location.href = "menu.html";
            }, 2000)
        });
    </script>
</body>
</html>
